<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e16;color:#eef1fb;font:12px Inter,Arial,sans-serif}.top{padding:18px 18px 14px;background:linear-gradient(160deg,#151a2a,#0d1019 73%);border-bottom:1px solid #2c3347}.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;letter-spacing:.1em}.brand-mark{width:15px;height:15px;border-radius:50%;border:2px solid #b7c4ed;box-shadow:inset 0 0 0 3px #141a2a,0 0 14px #8077ff;background:linear-gradient(135deg,#9d91ff,#5579ff)}.sub{font:10px ui-monospace,monospace;color:#aeb9d2;letter-spacing:.11em;margin-top:8px}.controls{display:flex;gap:9px;margin-top:15px}input{width:100%;height:40px;background:#151b2a;border:1px solid #394362;color:#f7f8ff;border-radius:7px;padding:0 12px;font-size:13px;outline:none}input:focus{border-color:#918bff;box-shadow:0 0 0 2px #8077ff20}.search-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid #a3a0ff;border-radius:7px;background:linear-gradient(145deg,#aaa0ff,#6657c8);color:#fff;cursor:pointer}.search-btn svg{width:18px;height:18px}.tabs{display:flex;gap:5px;overflow-x:auto;padding:0 18px 10px;border-bottom:1px solid #252d40}.tab{height:27px;padding:0 9px;border:1px solid transparent;border-radius:5px;background:transparent;color:#aeb9d2;font:10px ui-monospace,monospace;white-space:nowrap;cursor:pointer}.tab.active{background:#252d43;border-color:#4c5575;color:#fff}.tab.fav{color:#dfd4ff}.main{padding:12px 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;height:338px;overflow-y:auto;padding-right:2px}.icon{min-width:0;min-height:91px;padding:8px;background:linear-gradient(145deg,#242b40,#111622);border:1px solid #35405d;border-radius:8px;color:#e8ecf9;cursor:pointer;text-align:left;transition:border-color .14s,transform .14s}.icon:hover,.icon.selected{border-color:#a09bff;box-shadow:0 0 0 1px #776ff055,0 8px 17px #0005;transform:translateY(-1px)}.glyph{height:54px;display:grid;place-items:center}.glyph svg{width:52px;height:52px;filter:drop-shadow(0 5px 5px #0009)}.label{display:block;font-size:10px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{position:absolute;top:6px;right:6px;border:0;background:transparent;color:#75809c;font-size:14px;line-height:1;cursor:pointer}.star.saved{color:#ba9aff}.empty{grid-column:1/-1;display:grid;place-items:center;color:#aeb9d2;font:11px ui-monospace,monospace;border:1px dashed #35405d;border-radius:8px}.status{min-height:38px;display:flex;align-items:center;color:#b8c2dc;font:10px ui-monospace,monospace;padding:0 18px;border-top:1px solid #2c3347}.footer{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 18px}button{font:inherit}.footer button{height:46px;border:1px solid #3c4767;border-radius:7px;background:#2b3554;color:#fff;font-weight:750;cursor:pointer}.footer .primary{border-color:#9e98ff;background:linear-gradient(135deg,#9d95ff,#6253bd);box-shadow:inset 0 1px #ffffff33}.footer button:hover{filter:brightness(1.1)}
</style></head><body><header class="top"><div class="brand"><span class="brand-mark"></span>AD ASTRA</div><div class="sub" id="sub">FIGMA PLUGIN / LOADING LIBRARY</div><div class="controls"><input id="search" placeholder="Search 106 icons" autocomplete="off"><button class="search-btn" id="search-button" aria-label="Search icons" title="Search icons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg></button></div></header><nav class="tabs" id="tabs"></nav><main class="main"><div class="grid" id="grid"></div></main><div class="status" id="status">Loading the Ad astra catalogue…</div><footer class="footer"><button id="copy">Copy SVG</button><button class="primary" id="insert">Insert into Figma</button></footer><script>
let catalog=[], pendingCatalog=[], favorites=[], active='', filter='All', accent='#8f83ff'; const grid=document.getElementById('grid'), search=document.getElementById('search'), status=document.getElementById('status'), tabs=document.getElementById('tabs');
function renderTabs(){const labels=['All','Favorites',...new Set(catalog.map(i=>i.category))];tabs.innerHTML=labels.map(label=>`<button class="tab ${label===filter?'active':''} ${label==='Favorites'?'fav':''}" data-filter="${label}">${label==='Favorites'?'★ ':''}${label}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderTabs();render()})}
function toggleFavorite(name){favorites=favorites.includes(name)?favorites.filter(n=>n!==name):[...favorites,name];parent.postMessage({pluginMessage:{type:'set-favorites',favorites}},'*');render()}
function render(){const q=search.value.trim().toLowerCase();const results=catalog.filter(icon=>(filter==='All'||filter==='Favorites'&&favorites.includes(icon.name)||icon.category===filter)&&icon.name.toLowerCase().includes(q));grid.innerHTML=results.length?results.map(icon=>`<div class="icon ${icon.name===active?'selected':''}" data-name="${icon.name}" role="button" tabindex="0"><button class="star ${favorites.includes(icon.name)?'saved':''}" data-star="${icon.name}" aria-label="Toggle favorite">★</button><span class="glyph">${icon.svg}</span><span class="label">${icon.name}</span></div>`).join(''):'<div class="empty">No icons match “'+search.value.replace(/[<>&"]/g,'')+'”</div>';document.querySelectorAll('.icon').forEach(card=>card.onclick=e=>{if(e.target.dataset.star)return;active=card.dataset.name;render();status.textContent=active+' ready.'});document.querySelectorAll('.star').forEach(button=>button.onclick=e=>{e.stopPropagation();toggleFavorite(button.dataset.star)})}
search.oninput=render;document.getElementById('search-button').onclick=()=>{search.focus();render()};
document.getElementById('insert').onclick=()=>{if(!active)return status.textContent='Choose an icon first.';parent.postMessage({pluginMessage:{type:'insert',name:active,accent}},'*')};
document.getElementById('copy').onclick=()=>{if(!active)return status.textContent='Choose an icon first.';parent.postMessage({pluginMessage:{type:'get-svg',name:active,accent}},'*')};
function copy(text){if(navigator.clipboard)return navigator.clipboard.writeText(text);const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();return Promise.resolve()}
function requestCatalog(){parent.postMessage({pluginMessage:{type:'ready'}},'*')}
const catalogRetry=window.setInterval(()=>{if(!catalog.length)requestCatalog()},600);
onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='catalog-start'){pendingCatalog=[];status.textContent='Loading the Ad astra catalogue…'}if(m.type==='catalog-batch')pendingCatalog.push(...m.icons);if(m.type==='catalog-complete'){catalog=pendingCatalog;favorites=m.favorites||[];active=catalog[0]?.name||'';window.clearInterval(catalogRetry);document.getElementById('sub').textContent='FIGMA PLUGIN / '+catalog.length+' ICONS / MALIK LAWAL';status.textContent='Select an icon to insert.';renderTabs();render()}if(m.type==='svg')copy(m.svg).then(()=>status.textContent='SVG copied.').catch(()=>status.textContent='Copy was blocked by Figma.');if(m.type==='inserted')status.textContent=m.name+' inserted.'};
requestCatalog();
</script></body></html>
